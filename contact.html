<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cursor-glow"></div>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">sai<span>.</span>prateeth</a>
      <nav>
        <a href="index.html" class="nav-link">Home</a>

        <a href="contact.html" class="nav-link active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h1 class="hero-title">Get in touch</h1>
      <p class="hero-desc">Have a question, collaboration idea, or opportunity? Drop a message.</p>
      <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="your.email@example.com" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea rows="5" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Sai Prateeth P — Bangalore, India</p>
    <div class="footer-links">
      <a href="mailto:saiprateethp31@gmail.com">saiprateethp31@gmail.com</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
